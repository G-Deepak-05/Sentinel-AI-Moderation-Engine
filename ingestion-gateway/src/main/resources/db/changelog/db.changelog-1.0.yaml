databaseChangeLog:
  - changeSet:
      id: 1
      author: sentinel
      changes:
        - createTable:
            tableName: moderation_requests
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: payload
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
        - createTable:
            tableName: moderation_results
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: request_id
                  type: varchar(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_result_request
                    references: moderation_requests(id)
              - column:
                  name: action
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: toxicity_score
                  type: double precision
              - column:
                  name: severe_insult_score
                  type: double precision
              - column:
                  name: harassment_score
                  type: double precision
              - column:
                  name: threat_score
                  type: double precision
              - column:
                  name: explaining_tokens
                  type: text
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
        - createTable:
            tableName: audit_logs
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: result_id
                  type: varchar(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_audit_result
                    references: moderation_results(id)
              - column:
                  name: moderator_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: action_taken
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
  - changeSet:
      id: 2
      author: sentinel
      changes:
        - createTable:
            tableName: event_publication
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: listener_id
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: serialized_event
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: publication_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: completion_date
                  type: timestamp
